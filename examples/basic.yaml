# Permissions form a DAG: `implies` edges grant other permissions transitively.
permissions:
  - id: users:read
    description: Read user records
  - id: users:write
    description: Create, update and delete user records
    implies: [users:read]
  - id: billing:write
    description: Issue invoices and refunds
  - id: admin
    description: Everything
    implies: [users:write, billing:write]

# Resources are types with named actions. Each action maps to the permission it needs.
resources:
  - id: users
    description: User accounts
    actions:
      read: users:read
      write: users:write

# Endpoints require permissions directly (users:read) or via a resource action (users.write).
# All entries in `requires` must be satisfied.
endpoints:
  - id: GET /users/{id}
    requires: [users:read]
  - id: DELETE /users/{id}
    requires: [users.write]
  - id: POST /users/{id}/invoices
    requires: [users:read, billing:write]
  - id: GET /health
    public: true
