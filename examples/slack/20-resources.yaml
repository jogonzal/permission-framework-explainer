resources:
  - id: channels
    actions: { read: channels:read, join: channels:join, create: channels:create, archive: channels:archive }
  - id: messages
    actions: { read: messages:read, write: messages:write, delete-any: messages:delete-any }
  - id: files
    actions: { read: files:read, upload: files:upload }
